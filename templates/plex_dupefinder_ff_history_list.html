{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('plex_dupefinder_ff.static', filename='pdff.css') }}">

<section class="pdff-panel">
  <div class="pdff-heading">
    <div>
      <h3 class="pdff-title">정리 이력</h3>
      <p class="pdff-muted mb-0">최근 실행과 영상·외부 자막 처리 결과를 표시합니다.</p>
    </div>
    <button id="refresh_history_btn" type="button" class="btn btn-sm btn-outline-secondary">새로고침</button>
  </div>
  <div id="history_message" class="pdff-message" role="status" aria-live="polite"></div>
</section>

<section class="pdff-panel">
  <h3 class="pdff-title">최근 실행</h3>
  <div id="history_runs" class="pdff-empty">이력을 불러오는 중입니다.</div>
</section>

<section class="pdff-panel">
  <h3 class="pdff-title">최근 작업</h3>
  <div id="history_actions" class="pdff-empty">작업 이력을 불러오는 중입니다.</div>
</section>

<script src="{{ url_for('plex_dupefinder_ff.static', filename='pdff.js') }}"></script>
<script>
'use strict';
var package_name = {{ arg['package_name']|tojson }};
var historyPending = false;

function loadHistory() {
  if (historyPending) return;
  historyPending = true;
  document.getElementById('refresh_history_btn').disabled = true;
  globalSendCommand('history', '', '', '', function (ret) {
    historyPending = false;
    document.getElementById('refresh_history_btn').disabled = false;
    if (!PDFF.ok(ret)) {
      PDFF.message('history_message', PDFF.messageText(ret, '이력을 불러오지 못했습니다.'), false);
      return;
    }
    var data = PDFF.payload(ret);
    PDFF.message('history_message', '', true);
    PDFF.renderRuns('history_runs', data.runs);
    PDFF.renderActions('history_actions', data.items);
  });
}

document.getElementById('refresh_history_btn').addEventListener('click', loadHistory);
document.addEventListener('DOMContentLoaded', loadHistory);
</script>
{% endblock %}
