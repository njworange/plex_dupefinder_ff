{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ url_for('plex_dupefinder_ff.static', filename='pdff.css') }}">

<section class="pdff-panel">
  <h3 class="pdff-title">삭제 감사 이력</h3>
  <div class="row">
    <div class="col-md-2"><label class="small text-muted">Run ID</label><input id="run_filter" type="number" min="1" class="form-control form-control-sm"></div>
    <div class="col-md-3"><label class="small text-muted">상태</label><select id="status_filter" class="form-control form-control-sm"><option value="">전체</option><option value="success">성공</option><option value="blocked">차단</option><option value="failed">실패</option><option value="unknown">결과 확인 필요</option><option value="verification_failed">삭제 검증 실패</option><option value="critical">긴급 점검</option></select></div>
    <div class="col-md-2 d-flex align-items-end"><button id="history_filter_btn" class="btn btn-sm btn-primary">검색</button></div>
  </div>
  <div class="pdff-muted mt-3">검증 차단과 timeout 후 확인 불가 결과도 보존됩니다. 플러그인 UI에서는 감사 이력을 삭제하지 않습니다.</div>
</section>

<section class="pdff-panel">
  <div id="history_summary" class="pdff-muted mb-2"></div>
  <div id="history_list" class="pdff-empty">이력을 조회하는 중입니다.</div>
  <div class="pdff-toolbar justify-content-center mt-3"><button id="history_prev_btn" type="button" class="btn btn-sm btn-outline-secondary">이전</button><span id="history_page_label" class="pdff-muted"></span><button id="history_next_btn" type="button" class="btn btn-sm btn-outline-secondary">다음</button></div>
</section>

<section id="history_detail" class="pdff-panel" style="display:none">
  <div class="pdff-toolbar"><h3 class="pdff-title" style="margin:0">감사 상세</h3><button id="history_close_btn" class="btn btn-sm btn-outline-secondary">닫기</button></div>
  <pre id="history_json" class="pdff-code" style="max-height:65vh;overflow:auto;white-space:pre-wrap"></pre>
</section>

<script src="{{ url_for('plex_dupefinder_ff.static', filename='pdff.js') }}"></script>
<script>
'use strict';
var packageName = {{ arg['package_name']|tojson }};
var actionRows = [];
var currentPage = 1;
var totalPages = 1;
var pageSize = 50;

function renderHistory() {
  if (!actionRows.length) { $('#history_list').addClass('pdff-empty').text('조건에 맞는 감사 이력이 없습니다.'); return; }
  var html = '';
  actionRows.forEach(function (item) {
    html += '<article class="pdff-row"><div class="row align-items-center"><div class="col-md-2"><strong>#' + PDFF.esc(item.id) + '</strong><br>' + PDFF.badge(item.status) + '</div><div class="col-md-4"><strong>' + PDFF.esc(item.action) + '</strong><div class="pdff-muted">Run #' + PDFF.esc(item.run_id) + ' · Group #' + PDFF.esc(item.group_id) + '</div><div class="small">' + PDFF.esc(item.message || '') + '</div></div><div class="col-md-3"><span class="pdff-kv-label">유지 / 삭제 후보</span>#' + PDFF.esc(item.keep_candidate_id || '-') + ' / #' + PDFF.esc(item.candidate_id || '-') + '</div><div class="col-md-2"><span class="pdff-kv-label">시각</span>' + PDFF.esc(PDFF.date(item.created_at)) + '</div><div class="col-md-1"><button class="btn btn-sm btn-outline-secondary action-detail" data-id="' + PDFF.esc(item.id) + '">JSON</button></div></div></article>';
  });
  $('#history_list').removeClass('pdff-empty').html(html);
}

function loadHistory(resetPage) {
  if (resetPage) currentPage = 1;
  var payload = {page: currentPage, page_size: pageSize, status: $('#status_filter').val()};
  var runId = $('#run_filter').val();
  if (runId) payload.run_id = runId;
  PDFF.request(packageName, 'history', 'actions', payload, 'GET', function (ret) {
    if (ret.ret !== 'success') return;
    var result = ret.data || {};
    actionRows = result.items || [];
    currentPage = Number(result.page || 1);
    totalPages = Math.max(1, Number(result.pages || 1));
    $('#history_summary').text(Number(result.total || 0) + '개 감사 기록');
    $('#history_page_label').text(currentPage + ' / ' + totalPages);
    $('#history_prev_btn').prop('disabled', currentPage <= 1);
    $('#history_next_btn').prop('disabled', currentPage >= totalPages);
    renderHistory();
  });
}

$('#history_filter_btn').on('click', function () { loadHistory(true); });
$('#run_filter').on('keydown', function (e) { if (e.key === 'Enter') loadHistory(true); });
$('#history_prev_btn').on('click', function () { if (currentPage > 1) { currentPage -= 1; loadHistory(false); } });
$('#history_next_btn').on('click', function () { if (currentPage < totalPages) { currentPage += 1; loadHistory(false); } });
$(document).on('click', '.action-detail', function () {
  var id = Number($(this).data('id'));
  PDFF.request(packageName, 'history', 'action_detail', {action_id: id}, 'GET', function (ret) {
    if (ret.ret !== 'success') return;
    $('#history_json').text(JSON.stringify(PDFF.redact(ret.data || {}), null, 2));
    $('#history_detail').show()[0].scrollIntoView({behavior:'smooth', block:'start'});
  });
});
$('#history_close_btn').on('click', function () { $('#history_detail').hide(); });
$(document).ready(function () { loadHistory(true); });
</script>
{% endblock %}
